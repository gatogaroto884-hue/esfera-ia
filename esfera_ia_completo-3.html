const limpo=texto.replace(/[\p{Extended_Pictographic}\p{Emoji_Component}]/gu,"").replace(/\s+/g," ").trim();if(!limpo)return;
const fala=new SpeechSynthesisUtterance(limpo);fala.lang="pt-BR";fala.rate=.95;fala.pitch=1.08;fala.volume=1;
const voz=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().includes("pt-br"));if(voz)fala.voice=voz;
falando=true;botao.textContent="✧ ESFERA RESPONDENDO ✧";
fala.onend=()=>{falando=false;if(!modoFeitico)botao.textContent="✧ CONVERSAR ✧"};
fala.onerror=()=>{falando=false;botao.textContent="✧ CONVERSAR ✧"};speechSynthesis.speak(fala);
}
function iniciarEscuta(){
if(!reconhecimento){statusTexto.textContent="Seu navegador não oferece reconhecimento de voz. Experimente o Chrome.";return}
if(ouvindo||falando||encerrando||modoFeitico)return;if("speechSynthesis" in window)speechSynthesis.cancel();
try{reconhecimento.start()}catch(e){console.log(e)}
}
botao.addEventListener("click",iniciarEscuta);esfera.addEventListener("click",iniciarEscuta);
function despedirEReiniciar(){
if(encerrando)return;encerrando=true;
if(reconhecimento&&ouvindo)reconhecimento.stop();if("speechSynthesis" in window)speechSynthesis.cancel();
pararCameraGestos();pararSonsAmbiente();modoFeitico=false;falando=false;ouvindo=false;esfera.classList.remove("ouvindo");telaEsfera.classList.remove("feitico");
statusTexto.textContent="Obrigado por viver essa experiência mágica!";botao.textContent="ATÉ A PRÓXIMA!";
setTimeout(()=>{
telaEsfera.style.display="none";telaMago.style.display="none";videoMago.pause();videoMago.removeAttribute("src");videoMago.load();
abertura.style.display="flex";indiceAbertura=0;videoAnjo.src=videosAbertura[0];videoAnjo.play().catch(()=>{});
botaoComecar.disabled=false;botaoComecar.textContent="✧ CLIQUE PARA COMEÇAR SUA EXPERIÊNCIA ✧";
experienciaIniciada=false;transicaoIniciada=false;encerrando=false;musica.play().catch(()=>{});
},2500);
}
