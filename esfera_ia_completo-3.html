notaAtual=0;

temporizadoresAmbiente=[],
transicaoIniciada=false;

let dispositivoLED=null;
let bluetoothLED=null;
let ultimoBrilho=-1;

const SERVICO_LED="0000fff0-0000-1000-8000-00805f9b34fb";
const CARACTERISTICA_LED="0000fff3-0000-1000-8000-00805f9b34fb";

/* BLUETOOTH DA FITA LED */

async function conectarLuz(){
try{
if(!navigator.bluetooth){
throw new Error("Abra a Esfera IA no Chrome com HTTPS.");
}

statusTexto.textContent="Procurando suas luzes...";

dispositivoLED=await navigator.bluetooth.requestDevice({
filters:[{namePrefix:"ELK-BLED"}],
optionalServices:[SERVICO_LED]
});

dispositivoLED.addEventListener("gattserverdisconnected",()=>{
bluetoothLED=null;
botaoLuz.textContent="⚡ CONECTAR LUZES";
statusTexto.textContent="Luzes desconectadas.";
});

const servidor=await dispositivoLED.gatt.connect();
const servico=await servidor.getPrimaryService(SERVICO_LED);

bluetoothLED=await servico.getCharacteristic(CARACTERISTICA_LED);

botaoLuz.textContent="⚡ LUZES CONECTADAS";
statusTexto.textContent="Conexão Bluetooth estabelecida!";

await ligarLED();

}catch(e){
console.error("Bluetooth:",e);
bluetoothLED=null;
botaoLuz.textContent="⚡ CONECTAR LUZES";
statusTexto.textContent="Não consegui conectar: "+e.message;
}
}

async function enviarComandoLED(bytes){
if(!bluetoothLED)return;

await bluetoothLED.writeValueWithoutResponse(
new Uint8Array(bytes)
);
}

async function ligarLED(){
await enviarComandoLED([
0x7E,0x07,0x04,0xFF,0x00,0x01,0x02,0x01,0xEF
]);
}

async function desligarLED(){
await enviarComandoLED([
0x7E,0x07,0x04,0x00,0x00,0x00,0x02,0x01,0xEF
]);
}

async function corLED(r,g,b){
await enviarComandoLED([
0x7E,0x07,0x05,0x03,r,g,b,0x10,0xEF
]);
}

async function brilhoLED(valor){
if(!bluetoothLED)return;

const brilho=Math.max(0,Math.min(100,Math.round(valor)));

if(Math.abs(brilho-ultimoBrilho)<3)return;

ultimoBrilho=brilho;

statusTexto.textContent="Ajustando a intensidade da luz...";
}

/* BOTÕES DAS LUZES */

$("ledDesligar").addEventListener("click",desligarLED);

/* ÁUDIO */

musica.volume=.22;

function prepararAudio(){
try{
audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();
if(audioContext.state==="suspended")audioContext.resume();
}catch(e){}
}

function notaMagica(frequencia,duracao=.55,volume=.13){
prepararAudio();
if(!audioContext)return;

const agora=audioContext.currentTime,
oscilador=audioContext.createOscillator(),
harmonico=audioContext.createOscillator(),
ganho=audioContext.createGain(),
ganhoH=audioContext.createGain(),
filtro=audioContext.createBiquadFilter(),
eco=audioContext.createDelay(1),
retorno=audioContext.createGain();

oscilador.type="triangle";
oscilador.frequency.setValueAtTime(frequencia,agora);
harmonico.type="sine";
harmonico.frequency.setValueAtTime(frequencia*2.01,agora);

filtro.type="lowpass";
filtro.frequency.value=2600;

ganho.gain.setValueAtTime(.0001,agora);
ganho.gain.exponentialRampToValueAtTime(volume,agora+.025);
ganho.gain.exponentialRampToValueAtTime(.0001,agora+duracao);

ganhoH.gain.setValueAtTime(.0001,agora);
ganhoH.gain.exponentialRampToValueAtTime(volume*.22,agora+.025);
ganhoH.gain.exponentialRampToValueAtTime(.0001,agora+duracao*.65);

eco.delayTime.value=.22;
retorno.gain.value=.12;

oscilador.connect(filtro);
harmonico.connect(ganhoH);
ganhoH.connect(filtro);
filtro.connect(ganho);
ganho.connect(audioContext.destination);
ganho.connect(eco);
eco.connect(retorno);
retorno.connect(audioContext.destination);

oscilador.start(agora);
harmonico.start(agora);
oscilador.stop(agora+duracao);
harmonico.stop(agora+duracao*.7);
}

function somBolha(){
prepararAudio();
if(!audioContext)return;

const agora=audioContext.currentTime,
osc=audioContext.createOscillator(),
ganho=audioContext.createGain();

osc.type="sine";
osc.frequency.setValueAtTime(180+Math.random()*100,agora);
osc.frequency.exponentialRampToValueAtTime(65,agora+.16);

ganho.gain.setValueAtTime(.0001,agora);
ganho.gain.exponentialRampToValueAtTime(.055,agora+.025);
ganho.gain.exponentialRampToValueAtTime(.0001,agora+.18);

osc.connect(ganho);
ganho.connect(audioContext.destination);
osc.start(agora);
osc.stop(agora+.2);
}

function somRuido(duracao=.4,volume=.08,frequencia=900){
prepararAudio();
if(!audioContext)return;

const agora=audioContext.currentTime,
tamanho=Math.floor(audioContext.sampleRate*duracao),
buffer=audioContext.createBuffer(1,tamanho,audioContext.sampleRate),
dados=buffer.getChannelData(0);

for(let i=0;i<tamanho;i++)dados[i]=(Math.random()*2-1)*(1-i/tamanho);

const fonte=audioContext.createBufferSource(),
filtro=audioContext.createBiquadFilter(),
ganho=audioContext.createGain();

fonte.buffer=buffer;
filtro.type="lowpass";
filtro.frequency.value=frequencia;
ganho.gain.setValueAtTime(volume,agora);
ganho.gain.exponentialRampToValueAtTime(.0001,agora+duracao);

fonte.connect(filtro);
filtro.connect(ganho);
ganho.connect(audioContext.destination);

fonte.start(agora);
fonte.stop(agora+duracao);
}

function somExplosao(){
prepararAudio();
if(!audioContext)return;

somRuido(.65,.13,650);

const agora=audioContext.currentTime,
osc=audioContext.createOscillator(),
ganho=audioContext.createGain();

osc.type="sine";
osc.frequency.setValueAtTime(120,agora);
osc.frequency.exponentialRampToValueAtTime(35,agora+.55);

ganho.gain.setValueAtTime(.0001,agora);
ganho.gain.exponentialRampToValueAtTime(.18,agora+.035);
ganho.gain.exponentialRampToValueAtTime(.0001,agora+.6);

osc.connect(ganho);
ganho.connect(audioContext.destination);
osc.start(agora);
osc.stop(agora+.62);
}

function somCoruja(){
prepararAudio();
if(!audioContext)return;

const agora=audioContext.currentTime;

[0,.42].forEach((atraso,i)=>{
const osc=audioContext.createOscillator(),
ganho=audioContext.createGain(),
filtro=audioContext.createBiquadFilter(),
inicio=agora+atraso,
frequencia=i===0?480:410;

osc.type="triangle";
osc.frequency.setValueAtTime(frequencia,inicio);
osc.frequency.exponentialRampToValueAtTime(frequencia*.58,inicio+.38);

filtro.type="lowpass";
filtro.frequency.value=850;

ganho.gain.setValueAtTime(.0001,inicio);
ganho.gain.exponentialRampToValueAtTime(.065,inicio+.06);
ganho.gain.exponentialRampToValueAtTime(.0001,inicio+.42);

osc.connect(filtro);
filtro.connect(ganho);
ganho.connect(audioContext.destination);

osc.start(inicio);
osc.stop(inicio+.44);
});
}

function somMagico(){
notaMagica(660,.35,.09);
setTimeout(()=>notaMagica(880,.5,.08),140);
setTimeout(()=>notaMagica(1174,.7,.07),280);
}

function somSuspense(){
notaMagica(196,1.1,.055);
setTimeout(()=>notaMagica(146,1.3,.045),450);
}

function risadaMalefica(){
prepararAudio();
if(!audioContext)return;

const agora=audioContext.currentTime,
tempos=[0,.34,.68,1.08,1.48,1.92,2.38],
frequencias=[180,165,190,155,175,145,125];

tempos.forEach((tempo,i)=>{
const inicio=agora+tempo,
osc=audioContext.createOscillator(),
formante=audioContext.createBiquadFilter(),
ganho=audioContext.createGain(),
vibrato=audioContext.createOscillator(),
profundidade=audioContext.createGain();

osc.type="sawtooth";
osc.frequency.setValueAtTime(frequencias[i],inicio);
osc.frequency.exponentialRampToValueAtTime(frequencias[i]*.72,inicio+.23);

formante.type="bandpass";
formante.frequency.value=650;
formante.Q.value=1.2;

vibrato.type="sine";
vibrato.frequency.value=7;
profundidade.gain.value=8;
vibrato.connect(profundidade);
profundidade.connect(osc.frequency);

ganho.gain.setValueAtTime(.0001,inicio);
ganho.gain.exponentialRampToValueAtTime(.12,inicio+.035);
ganho.gain.exponentialRampToValueAtTime(.0001,inicio+.27);

osc.connect(formante);
formante.connect(ganho);
ganho.connect(audioContext.destination);

vibrato.start(inicio);
osc.start(inicio);
osc.stop(inicio+.29);
vibrato.stop(inicio+.29);
});
}

function somSurpresaEntrada(){
notaMagica(523,.4,.1);
setTimeout(()=>notaMagica(784,.5,.11),130);
setTimeout(()=>notaMagica(1046,.7,.1),280);
}

function agendarSom(funcao,minimo,maximo){
if(!sonsAmbienteAtivos)return;

const espera=minimo+Math.random()*(maximo-minimo);

const id=setTimeout(()=>{
if(!sonsAmbienteAtivos)return;
funcao();
agendarSom(funcao,minimo,maximo);
},espera);

temporizadoresAmbiente.push(id);
}

function iniciarSonsAmbiente(){
pararSonsAmbiente();
sonsAmbienteAtivos=true;
agendarSom(somBolha,1800,3300);
agendarSom(somCoruja,9000,14500);
agendarSom(somMagico,5500,8500);
agendarSom(somExplosao,11000,17000);
agendarSom(somSuspense,8500,13000);
}

function pararSonsAmbiente(){
sonsAmbienteAtivos=false;
temporizadoresAmbiente.forEach(id=>clearTimeout(id));
temporizadoresAmbiente=[];
}

// PARTÍCULAS E EFEITOS MÁGICOS
// ===============================

const particulas = $("particulas");

if (particulas) {
    for (let i = 0; i < 35; i++) {
        const p = document.createElement("span");
        p.className = "particula";
        p.style.left = Math.random() * 100 + "%";
        p.style.top = Math.random() * 100 + "%";
        p.style.animationDelay = Math.random() * 5 + "s";
        particulas.appendChild(p);
    }
}

function criarExplosao(x, y) {
    if (!particulas) return;

    for (let i = 0; i < 18; i++) {
        const p = document.createElement("span");
        p.className = "particula";
        p.style.position = "absolute";
        p.style.left = x + "px";
        p.style.top = y + "px";

        const angulo = Math.random() * Math.PI * 2;
        const distancia = 30 + Math.random() * 90;

        p.style.setProperty("--dx", Math.cos(angulo) * distancia + "px");
        p.style.setProperty("--dy", Math.sin(angulo) * distancia + "px");

        particulas.appendChild(p);
        setTimeout(() => p.remove(), 1200);
    }
}

function ativarFeitico() {
    const esfera = $("esfera");
    if (esfera) {
        esfera.classList.add("brilhando");
        setTimeout(() => esfera.classList.remove("brilhando"), 1000);
    }

    if (typeof somMagico === "function") somMagico();

    if (particulas) {
        criarExplosao(window.innerWidth / 2, window.innerHeight / 2);
    }
}

function tocarNotaDaMao() {
    ativarFeitico();
}


// ===============================
// CÂMERA E MOVIMENTOS DA MÃO
// ===============================

let cameraAtiva = false;
let ultimaPosicaoMao = null;
let ultimoFeitico = 0;
let detectorMaos = null;
let videoCamera = null;

async function iniciarCameraGestos() {
    if (cameraAtiva) return;

    try {
        videoCamera = document.createElement("video");
        videoCamera.autoplay = true;
        videoCamera.playsInline = true;
        videoCamera.muted = true;

        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "user",
                width: 640,
                height: 480
            },
            audio: false
        });

        videoCamera.srcObject = stream;
        await videoCamera.play();

        const modulo = await import(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14"
        );

        const vision = await modulo.FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );

        detectorMaos = await modulo.HandLandmarker.createFromOptions(
            vision,
            {
                baseOptions: {
                    modelAssetPath:
                        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numHands: 1
            }
        );

        cameraAtiva = true;
        detectarMovimentos();

    } catch (erro) {
        console.error("Erro ao iniciar câmera:", erro);
        alert("Não foi possível iniciar a câmera. Verifique a permissão do Chrome.");
    }
}

function detectarMovimentos() {
    if (!cameraAtiva || !detectorMaos || !videoCamera) return;

    if (videoCamera.readyState >= 2) {
        const resultado = detectorMaos.detectForVideo(
            videoCamera,
            performance.now()
        );

        if (resultado.landmarks && resultado.landmarks.length > 0) {
            const mao = resultado.landmarks[0];
            const centro = mao[9];

            if (ultimaPosicaoMao !== null) {
                const movimento = Math.abs(centro.y - ultimaPosicaoMao);
                const agora = Date.now();

                if (movimento > 0.035 && agora - ultimoFeitico > 700) {
                    ultimoFeitico = agora;
                    tocarNotaDaMao();
                }
            }

            ultimaPosicaoMao = centro.y;
        } else {
            ultimaPosicaoMao = null;
        }
    }

    requestAnimationFrame(detectarMovimentos);
}


// ===============================
// CONVERSA COM A INTELIGÊNCIA ARTIFICIAL
// ===============================

const SERVIDOR = "https://esfera-iabib.onrender.com/chat";

async function conversarComIA(texto) {
    if (!texto || !texto.trim()) return;

    const mensagem = texto.trim();

    try {
        processando = true;

        const resposta = await fetch(SERVIDOR, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                mensagem: mensagem,
                texto: mensagem
            })
        });

        if (!resposta.ok) {
            throw new Error("Erro na comunicação com o servidor.");
        }

        const dados = await resposta.json();

        const textoResposta =
            dados.resposta ||
            dados.texto ||
            dados.message ||
            "Não consegui responder agora.";

        if (typeof mostrarMensagem === "function") {
            mostrarMensagem(textoResposta);
        }

        falar(textoResposta);

    } catch (erro) {
        console.error("Erro na IA:", erro);

        const erroTexto = "Tive um probleminha de conexão. Tente novamente.";

        if (typeof mostrarMensagem === "function") {
            mostrarMensagem(erroTexto);
        }

        falar(erroTexto);

    } finally {
        processando = false;
    }
}


// ===============================
// VOZ DA INTELIGÊNCIA ARTIFICIAL
// ===============================

function falar(texto) {
    if (!("speechSynthesis" in window)) return;

    window.speechSynthesis.cancel();

    const fala = new SpeechSynthesisUtterance(texto);
    fala.lang = "pt-BR";
    fala.rate = 0.95;
    fala.pitch = 1;
    fala.volume = 1;

    window.speechSynthesis.speak(fala);
}


// ===============================
// RECONHECIMENTO DE VOZ
// ===============================

let reconhecimento = null;
let ouvindo = false;
let encerrando = false;
let processando = false;

function iniciarReconhecimento() {
    const Reconhecimento =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!Reconhecimento) {
        alert("O reconhecimento de voz não está disponível neste navegador.");
        return;
    }

    reconhecimento = new Reconhecimento();
    reconhecimento.lang = "pt-BR";
    reconhecimento.continuous = false;
    reconhecimento.interimResults = false;

    reconhecimento.onstart = () => {
        ouvindo = true;
        console.log("Ouvindo...");
    };

    reconhecimento.onresult = (evento) => {
        const texto = evento.results[0][0].transcript;
        ouvir(texto);
    };

    reconhecimento.onerror = (evento) => {
        console.error("Erro no reconhecimento:", evento.error);
        ouvindo = false;
    };

    reconhecimento.onend = () => {
        ouvindo = false;
    };

    reconhecimento.start();
}

function ouvir(texto) {
    if (!texto || processando) return;

    const comando = texto.toLowerCase().trim();

    if (comando.includes("ligar luz") || comando.includes("acender luz")) {
        if (typeof ligarLED === "function") ligarLED();
        falar("Acendendo as luzes.");
        return;
    }

    if (comando.includes("apagar luz") || comando.includes("desligar luz")) {
        if (typeof desligarLED === "function") desligarLED();
        falar("Apagando as luzes.");
        return;
    }

    if (comando.includes("luz roxa")) {
        if (typeof ledRoxo === "function") ledRoxo();
        falar("Ativando a luz roxa.");
        return;
    }

    if (comando.includes("luz azul")) {
        if (typeof ledAzul === "function") ledAzul();
        falar("Ativando a luz azul.");
        return;
    }

    if (comando.includes("luz verde")) {
        if (typeof ledVerde === "function") ledVerde();
        falar("Ativando a luz verde.");
        return;
    }

    conversarComIA(texto);
}


// ===============================
// BOTÃO DE CONVERSA
// ===============================

const botaoMicrofone = $("botaoMicrofone");
const botaoEnviar = $("botaoEnviar");
const campoMensagem = $("campoMensagem");

if (botaoMicrofone) {
    botaoMicrofone.addEventListener("click", () => {
        if (!ouvindo) iniciarReconhecimento();
    });
}

if (botaoEnviar && campoMensagem) {
    botaoEnviar.addEventListener("click", () => {
        const texto = campoMensagem.value;
        campoMensagem.value = "";
        conversarComIA(texto);
    });

    campoMensagem.addEventListener("keydown", (evento) => {
        if (evento.key === "Enter") {
            evento.preventDefault();
            botaoEnviar.click();
        }
    });
}


// ===============================
// ENCERRAR E REINICIAR
// ===============================

function despedirEReiniciar() {
    encerrando = true;

    if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
    }

    if (reconhecimento) {
        try {
            reconhecimento.stop();
        } catch (erro) {}
    }

    if (videoCamera && videoCamera.srcObject) {
        videoCamera.srcObject.getTracks().forEach(track => track.stop());
    }

    cameraAtiva = false;
    ouvindo = false;

    if (typeof pararMusica === "function") {
        pararMusica();
    }

    window.location.reload();
}

window.addEventListener("pagehide", () => {
    if (videoCamera && videoCamera.srcObject) {
        videoCamera.srcObject.getTracks().forEach(track => track.stop());
    }

    if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
    }
});


// ===============================
// FINAL DO PROJETO
// ===============================
